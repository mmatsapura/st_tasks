# Задание 3:
# Задача: Спроектировать и написать с нуля файл docker-compose.yml для веб-сервиса сокращения ссылок, состоящего из 3 контейнеров:

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '8080:5000'
    volumes:
      - ./:/code
    env_file:
      - .env
    environment:
      REDIS_HOST: cache
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      - nginx
      - cache
    restart: unless-stopped

  cache:
    image: redis:7-alpine
    command: redis-server --requirepass my_redis_pass
    volumes:
      - redis_data:/data

  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  redis_data: